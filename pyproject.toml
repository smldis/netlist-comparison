[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netlist-comparison"
version = "0.1.0"
description = "Tentative structural correspondence and conditional differences for canonical analog netlists."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["spice-canonical>=0.1.0", "numpy>=1.24", "scipy>=1.10"]

[project.scripts]
netlist-compare = "netlist_comparison.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../spice-canonical/src"]

[tool.uv.sources]
spice-canonical = { workspace = true }
